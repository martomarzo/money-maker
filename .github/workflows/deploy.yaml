# Requires a self-hosted runner registered on the docker host, with the
# runner user a member of the `docker` group, and /opt/money-maker/.env
# populated from .env.example.

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: docker compose --env-file /opt/money-maker/.env -f docker/compose.yaml up -d --build

      - run: docker image prune -f
